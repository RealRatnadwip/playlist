name = "playlist-ratnadwip-com"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Public environment variables (DO NOT put secrets or credentials here)
[vars]
ENVIRONMENT = "production"
SITE_URL = "https://playlist.ratnadwip.com"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "playlist_db"
database_id = "f06235aa-ed84-4bc9-afc0-3a7905cc1363"
migrations_dir = "migrations"

# Optional Cloudflare R2 Bucket for custom playlist artwork uploads
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "playlist-media"

